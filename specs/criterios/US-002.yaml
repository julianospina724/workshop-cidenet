story_id: "US-002"
titulo_historia: "Como Admin quiero ver una tabla paginada de usuarios con búsqueda por nombre/email y filtros por rol y por estado (activo/inactivo) para encontrar y gestionar cuentas rápidamente"
criterios_aceptacion:
  escenarios_exito:
    - "La tabla incluye filtros por rol, nombres, apellidos, correo electrónico y fechas de alta/actualización."
    - "Permite ordenar por columnas."
    - "Incluye paginación."
    - "Acceso: Admin y Editor pueden ver esta tabla (Editor solo lectura); Viewer no tiene permiso sobre el recurso users, según la matriz del caso."
    - "Orden por defecto (sin filtros aplicados): por nombres y apellidos, ascendente."
    - "Paginación: el usuario elige la cantidad de registros a mostrar por página (no es un tamaño fijo)."
  validaciones_reglas:
    - "Los filtros se combinan entre sí (AND) — todos los criterios aplicados a la vez, no son excluyentes."
    - "El filtro de fechas (alta/actualización) siempre es un rango (desde/hasta), no una fecha exacta."
    - "La búsqueda por nombre/apellido/email es parcial (contiene el texto) e insensible a mayúsculas/minúsculas."
  manejo_errores:
    - "Error técnico (ej. falla de conexión con el backend): se muestra un mensaje general de error."
    - "Sin resultados (con o sin filtros aplicados): se muestra un mensaje indicando que no se encontraron registros para mostrar."
  requisitos_ux:
    - "Mientras se carga o actualiza la tabla (filtros, orden, paginación) se muestra un spinner de carga."
  casos_edge:
    - "🔥 [gap-SEC] La tabla de usuarios nunca incluye la contraseña ni su hash entre los datos devueltos por fila."
    - "🔥 [gap-AUD] Los usuarios en estado 'eliminado' (soft delete, ver US-004) se excluyen siempre de esta tabla — no aparecen ni con el filtro de estado, que solo distingue activo/inactivo."
    - "El datepicker de 'hasta' restringe en la UI la selección de una fecha anterior a la de 'desde' (previene rango invertido desde la interfaz)."
    - "El backend valida también que 'hasta' no sea anterior a 'desde', como respaldo — no depende solo de la restricción de la UI."
validacion_smart:
  specific: true
  measurable: true
  achievable: true
  relevant: true
  testable: true
